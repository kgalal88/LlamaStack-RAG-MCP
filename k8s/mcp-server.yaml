apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        # Update this image path if pushing to internal registry or Docker Hub
        image: image-registry.openshift-image-registry.svc:5000/my-project/chat-mcp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  labels:
    app: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-server-route
  labels:
    app: mcp-server
  annotations:
    # Sets HAProxy gateway timeout to 10 minutes (600s / 10m / 1h)
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: mcp-server-service
  port:
    targetPort: 8081