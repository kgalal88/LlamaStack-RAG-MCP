apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: vllm-host-proxy
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    containers:
      - name: kserve-container
        image: alpine/socat:latest
        command: ["socat"]
        args: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:172.25.128.1:8000"]
        ports:
          - containerPort: 8080
            name: h2c
            protocol: TCP
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-host-proxy-route
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: vllm-host-proxy-predictor
  port:
    targetPort: 8080
