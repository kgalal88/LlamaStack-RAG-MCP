apiVersion: v1
kind: ConfigMap
metadata:
  name: llmd-config
data:
  config.yaml: |
    model_list:
      # Target 1: Medium Worker (3B)    
      - model_name: qwen2.5:3b
        litellm_params:
          model: openai/qwen2.5:3b
          api_base: "http://vllm-qwen3-3b-predictor.kserve.svc.cluster.local:8080/v1"
          api_key: "NULL"

      # Target 2: Small Worker (0.5B)
      - model_name: qwen2.5:0.5b
        litellm_params:
          model: openai/qwen2.5:0.5b
          api_base: "http://vllm-qwen3-0-5b-predictor.kserve.svc.cluster.local:8080/v1"
          api_key: "NULL"
---
# Router Deployment using LiteLLM Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-router
  labels:
    app: llm-d-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-router
  template:
    metadata:
      labels:
        app: llm-d-router
    spec:
      containers:
        - name: router
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/litellm
      volumes:
        - name: config-volume
          configMap:
            name: llmd-config
---
# Cluster Service for Router
apiVersion: v1
kind: Service
metadata:
  name: llm-d-service
  labels:
    app: llm-d-router
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: llm-d-router
---
# OpenShift External Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llm-d-route
spec:
  to:
    kind: Service
    name: llm-d-service
  port:
    targetPort: http